<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TTB Label Verification</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="panel" aria-labelledby="title">
        <p class="eyebrow">Phase 0</p>
        <h1 id="title">TTB Label Verification</h1>
        <p class="summary">Backend connection check</p>

        <div class="status-row">
          <span id="status-dot" class="dot pending" aria-hidden="true"></span>
          <span id="status-label">Checking API health...</span>
        </div>

        <pre id="health-output" class="output">Waiting for response...</pre>

        <button id="retry-button" type="button">Check Again</button>
      </section>
    </main>

    <script src="./config.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
