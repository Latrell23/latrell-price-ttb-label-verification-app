<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TTB Label Reviewer</title>
    <link rel="stylesheet" href="./styles.css?v=reviewer-1" />
  </head>
  <body>
    

    <header class="site-header">
      <div class="site-header-inner">
        <p class="agency-label">Alcohol Label Review</p>
        <h1 id="title">TTB Label Reviewer</h1>
        <p class="summary">
          Review backend-simulated TTB label records by comparing each JSON
          application payload against the visible label image.
        </p>
      </div>
    </header>

    <main class="shell">
      <section class="panel" aria-labelledby="title">
        <div class="review-toolbar">
          <div>
            <h2>Review Queue</h2>
            <p>
              Five simulated backend labels are ready for AI verification.
            </p>
          </div>
          <button id="run-all-reviews" class="primary-button" type="button">
            Run All AI Reviews
          </button>
        </div>

        <div id="review-error" class="form-error" role="alert" hidden></div>
        <div id="review-queue-status" class="loading-message" role="status" hidden></div>
        <section id="review-summary" class="review-summary" aria-label="Review summary"></section>
        <section id="review-list" class="review-list" aria-label="Labels to review"></section>
      </section>
    </main>

    <script src="./config.js"></script>
    <script type="module" src="./js/app.js?v=reviewer-1"></script>
  </body>
</html>
